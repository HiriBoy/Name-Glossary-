<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Names Glossary</title>
</head>
<body>

<div class="app-shell">
  <header class="top-bar">
    <div>
      <div class="title">Names Glossary</div>
      <div class="subtitle">Organized by gender, region, and meaning</div>
    </div>

    <span class="total-badge" id="totalBadge"></span>

    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search names, meanings, or origins…" aria-label="Search names">
    </div>

    <button class="action-btn primary" id="addButton">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Add name
    </button>
  </header>

  <div class="tabs" id="tabs"></div>

  <section class="form-panel" id="formPanel">
    <h3>Add a new name</h3>

    <div class="form-grid">
      <div class="field"><label>Name</label><input id="nameInput" type="text" placeholder="e.g. Soraya"></div>
      <div class="field"><label>Meaning</label><input id="meaningInput" type="text" placeholder="e.g. Star cluster"></div>
      <div class="field"><label>Origin</label><input id="originInput" type="text" placeholder="e.g. Persian"></div>
      <div class="field"><label>Gender</label><select id="genderSelect"></select></div>
      <div class="field"><label>Region</label><select id="regionSelect"></select></div>
      <div class="field" id="newRegionWrap" style="display:none">
        <label>New region name</label>
        <input id="newRegionInput" type="text" placeholder="e.g. Nordic">
      </div>
    </div>

    <div class="form-error" id="formError"></div>

    <div class="form-actions">
      <button type="button" class="action-btn primary" id="saveButton">Add to list</button>
      <button type="button" class="action-btn" id="cancelButton">Cancel</button>
    </div>
  </section>

  <div class="content-area">
    <nav class="region-panel" id="regionPanel" aria-label="Regions"></nav>
    <main class="main-panel" id="mainPanel"></main>
  </div>

  <div class="status-text" id="statusText"></div>
</div>

<script src="app.js"></script>
</body>
</html>
